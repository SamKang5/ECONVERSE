                  - listitem [ref=f1e479]: Nhận ra hình dạng phẳng (lài) và dốc (đứng) của đường cầu trên đồ thị.
                  - listitem [ref=f1e480]: Hiểu mối quan hệ giữa thay đổi giá, PED và doanh thu của người bán.
