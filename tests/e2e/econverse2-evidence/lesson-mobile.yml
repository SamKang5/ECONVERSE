            - article [ref=f1e463]:
              - generic [ref=f1e464]: HIỂU THẬT DỄ, NHỚ THẬT LÂU
              - heading "PED là gì và đường cầu phản ứng ra sao?" [level=2] [ref=f1e465]
              - paragraph [ref=f1e466]: Tập 2A giải thích Độ co giãn của Cầu theo Giá (PED) - thước đo sự nhạy cảm của người mua trước các biến động giá cả trên thị trường.
              - paragraph [ref=f1e467]: Độ co giãn của cầu theo giá (Price Elasticity of Demand - PED) đo lường mức độ thay đổi của lượng cầu khi giá của chính hàng hóa đó thay đổi. Đây là công cụ đo lường mức độ nhạy cảm của người tiêu dùng trước các biến động giá cả.
              - paragraph [ref=f1e468]: "Cầu co giãn (Elastic Demand) được ví như sợi dây thun đàn hồi: giá chỉ thay đổi một chút nhưng lượng cầu có thể phản ứng rất mạnh (tỷ lệ % thay đổi của lượng cầu lớn hơn tỷ lệ % thay đổi của giá). Những món có nhiều hàng thay thế thường có cầu co giãn."
              - paragraph [ref=f1e469]: "Cầu kém co giãn (Inelastic Demand) giống như thanh sắt cứng: dù giá có thay đổi nhiều, lượng cầu chỉ thay đổi tương đối nhỏ. Người học thường gặp điều này ở các hàng hóa thiết yếu hoặc khó thay thế."
              - paragraph [ref=f1e470]: Trên đồ thị, đường cầu co giãn thường tương đối phẳng (lài), trong khi đường cầu kém co giãn lại tương đối dốc (đứng). Nếu người bán tăng giá một mặt hàng có cầu co giãn cao, khách hàng sẽ bỏ đi rất nhiều khiến tổng doanh thu sụt giảm.
              - generic [ref=f1e471]:
                - heading "Sau bài này, bạn sẽ" [level=3] [ref=f1e472]
                - list [ref=f1e476]:
                  - listitem [ref=f1e477]: Định nghĩa và giải thích ý nghĩa của chỉ số PED.
